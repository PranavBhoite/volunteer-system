version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vms-postgres
    environment:
      POSTGRES_DB: volunteer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vmss-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d volunteer_db"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vmss-backend
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: volunteer_db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_DIALECT: postgres
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vmss-network
    restart: unless-stopped
    volumes:
      - ./server:/app
      - /app/node_modules

  # Frontend React App
  frontend:
    build:
      context: ./registration-model
      dockerfile: Dockerfile
    container_name: vms-frontend
    environment:
      CHOKIDAR_USEPOLLING: true
      WATCHPACK_POLLING: true
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - vmss-network
    restart: unless-stopped
    volumes:
      - ./registration-model:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  postgres_data:

networks:
  vmss-network:
    driver: bridge